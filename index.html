<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Library</h1>
      <button command="show-modal" commandfor="new-book-dialog">
        New Book
      </button>
    </header>
    <main></main>
    <dialog id="new-book-dialog">
      <form method="dialog">
        <h2>New Book</h2>
        <div class="form-column">
          <label for="title">Title (required)</label>
          <input type="text" name="title" id="title" required />
        </div>
        <div class="form-column">
          <label for="author">Author (required)</label>
          <input type="text" name="author" id="author" required />
        </div>
        <div class="form-column">
          <label for="pages">Pages (required)</label>
          <input type="tel" name="pages" id="pages" required />
        </div>
        <fieldset>
          <legend>Read or not read yet</legend>
          <div>
            <input type="radio" id="read" name="is_read" value="true" checked />
            <label for="read">Read</label>
          </div>
          <div>
            <input
              type="radio"
              id="not-read-yet"
              name="is_read"
              value="false"
            />
            <label for="not-read-yet">Not read yet</label>
          </div>
        </fieldset>
        <div class="buttons">
          <input type="button" id="cancel-btn" value="Cancel" />
          <input type="submit" value="Add New Book" />
        </div>
      </form>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
